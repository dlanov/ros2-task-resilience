[develop]
script_dir=$base/lib/task_resilience_ros
[install]
install_scripts=$base/lib/task_resilience_ros

# Lets `python3 -m pytest task_resilience_ros/test` work from a fresh checkout,
# before the package has been built or installed. The sibling task_resilience
# entry is for the same reason: nav2_adapter imports task_resilience's public
# API directly, and this lets its tests run against the source tree copy
# without requiring a colcon build first (colcon/ROS-sourced runs resolve it
# through the installed workspace instead, unaffected by this entry).
[tool:pytest]
pythonpath = . ../task_resilience
